name: RetentIQ CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  data-platform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Instalar dependências
        run: pip install pandas scikit-learn statsmodels joblib pyarrow openpyxl
      - name: Rodar checks de qualidade (contra warehouse de exemplo, se existir)
        run: |
          if [ -f warehouse/retentiq.db ]; then
            python quality/checks.py
          else
            echo "warehouse/retentiq.db não versionado (esperado) — pulei os checks no CI."
          fi

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/api/package.json
      - run: npm install
      - run: npm run lint --if-present
      - run: npm run build
      - run: npm test --if-present

  platform-messaging:
    name: platform (messaging + read models CQRS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"          # node:sqlite exige >= 22.5
      - name: Messaging bus tests
        run: node platform/messaging/tests/bus.test.js
      - name: CQRS read model tests
        run: node platform/read-models/tests/churn_read_model.test.js

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package.json
      - run: npm install
      - run: npm run lint --if-present
      - run: npm run build

  # PENDENTE: adicionar job de deploy (ex.: Vercel para web, Render/Fly.io para
  # api) — exclusivo do agente @devops conforme regras deste ambiente AIOX.
  # Deixado propositalmente fora deste workflow até você decidir o provedor.
